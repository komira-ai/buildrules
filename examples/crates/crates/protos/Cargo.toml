[package]
name = "protos"
version = "0.1.0"
edition = "2024"
publish = false

# A build script that compiles protobuf with protox (pure Rust, no `protoc`) and tonic-prost-build, the common shape of a
# gRPC proto crate: messages, a service trait and a client, no transport. It reads `proto/` and `src/names.rs` of this package, and `../../shared/proto`,
# which is outside it (declared in BUCK).
[dependencies]
prost = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
prost-types = "0.14.4"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
