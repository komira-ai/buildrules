[package]
name = "macros"
version = "0.1.0"
edition = "2024"
publish = false

# One use of each of three widely used proc-macro crates: serde_derive (serde's `derive`), clap_derive (clap's `derive`) and
# tokio-macros (tokio's `macros`). A proc-macro is a `.so` compiled for the build host and loaded by rustc; it is never linked.
[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
