[package]
name = "natlib_deps"
version = "0.1.0"
mojo = ["1.0.0"]

# `top` needs `mid` and `base` and `left` and `right` share `shared_base`, all through `deps` of native_library targets (examples/native). Only `top`, `left`, `right` and `base` (which `mid`, brought by `top`, needs)
# are named: the other archives come with them (rules/native/link.bzl). Each is `provided = true`: the archive is the product of a rule of the build, not compiled by mopm.
[native.base]
kind = "static"
provided = true

[native.top]
kind = "static"
provided = true

[native.left]
kind = "static"
provided = true

[native.right]
kind = "static"
provided = true

[targets]
lib = { path = "src/natlib_deps" }
tests = ["tests"]
