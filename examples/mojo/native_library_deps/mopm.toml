[package]
name = "natlib_deps"
version = "0.1.0"
mojo = ["1.0.0"]

# `top` needs `mid` and `base` and `left` and `right` share `shared_base`, all through `deps` of native_library targets (examples/native). Only `top`, `left`, `right` and `base` (which `mid`, brought by `top`, needs)
# are named: the other archives come with them (rules/native/link.bzl). The manifest names a source for each only because mopm requires one until it has `provided = true`.
[native.base]
kind = "static"
srcs = ["native/base.c"]

[native.top]
kind = "static"
srcs = ["native/top.c"]

[native.left]
kind = "static"
srcs = ["native/left.c"]

[native.right]
kind = "static"
srcs = ["native/right.c"]

[targets]
lib = { path = "src/natlib_deps" }
tests = ["tests"]
