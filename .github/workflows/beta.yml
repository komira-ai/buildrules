# The beta stage of the automatic release (RELEASING.md): a hello-world repository per language consumes the candidate commit of buildrules as an
# external Buck2 cell, the way a user does (beta/<lang>/ holds the files and a STEPS file of the commands; tools/stage runs them with the `buildrules`
# built from the candidate), builds, runs what it built, and builds a second time from nothing to see the outputs are the same bytes.
#
# It is the beta stage of the release: release.yml calls it after the command line is built, on a push to main (no pull request runs it), with
# the linux-x86_64 binary it built (the input `cli-artifact`; the legs run that file instead of building one). Every action runs on the runner (`-c buildrules_re.mode=local`); nothing here is built on this machine's behalf anywhere else.
#
#   tools         builds the stage tool and the command line from the candidate (or takes the release's), and says which legs are ready (a leg that waits for something is planned)
#   beta          ubuntu x86_64, one job per language: rust, cxx, zig, node, mixed
#   beta_mojo     the Mojo leg: ubuntu x86_64, the pinned mopm release (rules/mopm/pins.bzl) building a Mojo package
#   beta_arm      ubuntu-24.04-arm: the command line the release ships for linux-aarch64, run natively on a hello-world repository (zig, cxx): the version
#                 it says, `init` writing the same bytes at two paths, Buck2 loading the candidate and listing the targets. Not a build: no rule runs on this host yet
#   beta_macos    macos-15: the same for macos-arm64
#   host_arm      ubuntu-24.04-arm: the buck2 of that host, its execution platform, and every pinned download of the aarch64 hosts (docs/pins.md, "Other hosts")
#   unpack_cross  ubuntu x86_64: the macOS program of unpack, cross-built the way the release builds it, handed to unpack_macos
#   unpack_macos  macos-15: that program checked against its pin and run on the real darwin zig tarball (docs/pins.md, "unpack")
#   mojo_macos    macos-15: a Mac that runs Buck2 itself builds the tool tier of the Mojo rules and a Mojo package natively
#   beta_farm     the same repositories built on a remote-execution farm, only when the repository variable FARM_ADDRESS is set (RELEASING.md)
#
# Every platform other than linux x86_64 is tested here and nowhere else: a pull request runs ci.yml on linux x86_64 runners alone (RELEASING.md, "The tiers").
#
# ci/stages_check.zig (`//ci:workflow`) holds this file to all of that.
name: beta

on:
  workflow_call:
    inputs:
      # The artifact of the release workflow that holds the command line to walk (one file named `buildrules`: the linux-x86_64 binary build-cli stamped and
      # packaged). Empty: build it from the commit.
      cli-artifact:
        type: string
        default: ""
      # The artifact of the release workflow that holds the command line of all three targets (`linux-x86_64/buildrules`, `linux-aarch64/buildrules`,
      # `macos-arm64/buildrules`, the directory build-cli made). The native legs run the files of the other two. Empty: build them from the commit.
      cli-bins-artifact:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      mojo: ${{ steps.plan.outputs.mojo }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/stages_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Build the stage tool
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out stage //tools/stage:stage

      # The command line a user would have: built from the candidate, or, in the release, the very file that build-cli built with the planned
      # version stamped in and that the release ships (the tarball of it holds these bytes: `release record --ran-binary`).
      - name: Build the command line
        if: ${{ inputs.cli-artifact == '' }}
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out buildrules //cli:buildrules

      - name: The command line the release built
        if: ${{ inputs.cli-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.cli-artifact }}
          path: .

      - name: It is executable
        if: ${{ inputs.cli-artifact != '' }}
        run: chmod +x buildrules

      - name: Which legs are ready, and which are planned
        id: plan
        run: ./stage plan --root "$GITHUB_WORKSPACE" --output "$GITHUB_OUTPUT"

      # The native legs (beta_arm, beta_macos) run on the machines the release ships a command line for. The stage tool and the command line are built here, for
      # those two targets, on the x86_64 runner (zig cross-compiles both), with the buck2 that tools/buck2 pins for each (the digests are the sha256 of the .zst).
      - name: The version the command line says
        id: version
        run: ./stage version --buildrules ./buildrules --output "$GITHUB_OUTPUT"

      - name: A place for each other host
        run: mkdir -p native/linux-aarch64 native/macos-arm64

      - name: The stage tool for the other hosts, linux-aarch64
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out native/linux-aarch64/stage //tools/stage:stage_linux_aarch64

      - name: The stage tool for the other hosts, macos-arm64
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out native/macos-arm64/stage //tools/stage:stage_macos_arm64

      - name: The command line of every target, built from the commit
        if: ${{ inputs.cli-bins-artifact == '' }}
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out cli-bins //cli:release_binaries

      - name: The command line of every target, as the release built it
        if: ${{ inputs.cli-bins-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.cli-bins-artifact }}
          path: cli-bins

      # The runner of the native macOS leg is macos-15, but the command line it runs is cross-built here; its minimum macOS must stay at the pinned 13.0 (ci/macho_minos.zig
      # reads the Mach-O's minos, on any host).
      - name: The macOS command line is built for a macOS at most 13.0
        run: ./buck2 run --console simple -c buildrules_re.mode=local //ci:macho_minos_exe -- --max 13.0 cli-bins/macos-arm64/buildrules

      - name: The command line and buck2 of the other hosts
        run: |
          cp cli-bins/linux-aarch64/buildrules native/linux-aarch64/buildrules
          cp cli-bins/macos-arm64/buildrules native/macos-arm64/buildrules
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2-linux-aarch64.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-unknown-linux-gnu.zst
          echo "e35027a8e3f702fd9f080074ac64ebc80e2a0fe8d669d46d85afc31b0ec4a463  buck2-linux-aarch64.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2-linux-aarch64.zst -o native/linux-aarch64/buck2
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2-macos-arm64.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-apple-darwin.zst
          echo "aacdf7cabe34b9b5dc74866b8dcf7410cdbae3ad2dccef45b7ee9851cb781528  buck2-macos-arm64.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2-macos-arm64.zst -o native/macos-arm64/buck2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-native
          path: native
          retention-days: 7
          if-no-files-found: error

      - name: the farm leg is not run (FARM_ADDRESS or FARM_CONNECT_REF is not set)
        if: ${{ vars.FARM_ADDRESS == '' || vars.FARM_CONNECT_REF == '' }}
        run: echo "::notice title=beta farm leg::the repository variable FARM_ADDRESS or FARM_CONNECT_REF is not set, so the beta repositories were not built on a farm. Skipped; RELEASING.md says what to set."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-tools
          path: |
            ./stage
            ./buildrules
            ./buck2
          retention-days: 7
          if-no-files-found: error

  beta:
    needs: [tools]
    name: beta ${{ matrix.lang }} (ubuntu x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, cxx, zig, node, mixed]
    env:
      LANG_DIR: ${{ matrix.lang }}
      ORIGIN: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beta-tools
          path: tool
      - run: chmod +x tool/stage tool/buildrules tool/buck2
      - name: The repository, as a user starts it, built twice
        run: tool/stage beta --root "$GITHUB_WORKSPACE" --lang "$LANG_DIR" --work "$RUNNER_TEMP/beta" --origin "$ORIGIN" --commit "$COMMIT" --buck2 "$GITHUB_WORKSPACE/tool/buck2" --buildrules "$GITHUB_WORKSPACE/tool/buildrules" --exec local --summary "$GITHUB_STEP_SUMMARY"

  # The Mojo leg: the published mopm release that rules/mopm/pins.bzl pins builds beta/mojo. beta/mojo/STEPS has no `planned-until` line, so `tools/stage plan` says ready.
  beta_mojo:
    needs: [tools]
    if: ${{ needs.tools.outputs.mojo == 'ready' }}
    name: beta mojo (ubuntu x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ORIGIN: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beta-tools
          path: tool
      - run: chmod +x tool/stage tool/buildrules tool/buck2
      - name: The repository, as a user starts it, built twice
        run: tool/stage beta --root "$GITHUB_WORKSPACE" --lang mojo --work "$RUNNER_TEMP/beta" --origin "$ORIGIN" --commit "$COMMIT" --buck2 "$GITHUB_WORKSPACE/tool/buck2" --buildrules "$GITHUB_WORKSPACE/tool/buildrules" --exec local --summary "$GITHUB_STEP_SUMMARY"

  # The native legs: the command line the release ships for linux-aarch64 and for macos-arm64, run on a machine of that kind, on the hello-world repositories
  # that need nothing but `buildrules init` before the build (zig, cxx; the others run `cargo new`, `npm sync` and `mojo sync` first, which build a pinned tool).
  # What each proves: the file runs (it says the version the release planned), `init` writes the same bytes in two directories, and Buck2 reads the
  # candidate commit as the external cell and lists the targets of the repository. What none does is build: every toolchain of the rules runs on linux x86_64
  # (execution platform), and no unpack of the pinned downloads exists for these hosts (RELEASING.md, "The beta stage"; docs/pins.md, "Other hosts").
  beta_arm:
    needs: [tools]
    name: beta ${{ matrix.lang }} (ubuntu-24.04-arm) native, no build yet
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lang: [zig, cxx]
    env:
      LANG_DIR: ${{ matrix.lang }}
      ORIGIN: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.tools.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beta-native
          path: tool
      - run: chmod +x tool/linux-aarch64/stage tool/linux-aarch64/buildrules tool/linux-aarch64/buck2
      - name: The command line of this target, natively, up to the build
        run: tool/linux-aarch64/stage native --root "$GITHUB_WORKSPACE" --lang "$LANG_DIR" --work "$RUNNER_TEMP/native" --origin "$ORIGIN" --commit "$COMMIT" --buck2 "$GITHUB_WORKSPACE/tool/linux-aarch64/buck2" --buildrules "$GITHUB_WORKSPACE/tool/linux-aarch64/buildrules" --host linux-aarch64 --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

  beta_macos:
    needs: [tools]
    name: beta ${{ matrix.lang }} (macos-15) native, no build yet
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lang: [zig, cxx]
    env:
      LANG_DIR: ${{ matrix.lang }}
      ORIGIN: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.tools.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beta-native
          path: tool
      - run: chmod +x tool/macos-arm64/stage tool/macos-arm64/buildrules tool/macos-arm64/buck2
      - name: The command line of this target, natively, up to the build
        run: tool/macos-arm64/stage native --root "$GITHUB_WORKSPACE" --lang "$LANG_DIR" --work "$RUNNER_TEMP/native" --origin "$ORIGIN" --commit "$COMMIT" --buck2 "$GITHUB_WORKSPACE/tool/macos-arm64/buck2" --buildrules "$GITHUB_WORKSPACE/tool/macos-arm64/buildrules" --host macos-arm64 --version "$VERSION" --summary "$GITHUB_STEP_SUMMARY"

  # The linux-aarch64 host (docs/pins.md, "Other hosts"; rules/pins/hosts.bzl). The same buck2 release as above for this machine, the execution
  # platform that local mode registers on it (platforms:linux_aarch64, chosen by host_info()), and every pinned download of the aarch64 hosts, which
  # buck2 checks against the sha256 and the size in the table. Nothing is compiled here yet: no rule runs on this host until a pinned busybox exists
  # for it (hosts.bzl says why), and this job is where that work becomes visible as a red or a green leg.
  host_arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The release pinned in tools/buck2 for linux-aarch64 (the digest is the sha256 of the .zst); ci/stages_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-unknown-linux-gnu.zst
          echo "e35027a8e3f702fd9f080074ac64ebc80e2a0fe8d669d46d85afc31b0ec4a463  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: The machine is aarch64
        run: test "$(uname -m)" = aarch64

      - name: The execution platform of this machine is platforms:linux_aarch64
        run: |
          ./buck2 audit execution-platform-resolution -c buildrules_re.mode=local //rules/pins:host_downloads \
            | grep --fixed-strings --quiet "Execution platform: buildrules//platforms:linux_aarch64"

      - name: Download and verify the pins of the aarch64 hosts
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            --target-platforms buildrules//platforms:linux_aarch64 \
            //rules/pins:host_downloads

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The macOS program of unpack (tools/bootstrap, docs/pins.md "unpack") exactly as it is pinned: built on this linux runner the way the farm and the release build it
  # (`//tools/bootstrap:unpack_macos_aarch64`, cross-compiled), and handed to the macos-15 job below as an artifact. The macOS job checks its sha256 and size against the
  # pin row of rules/pins/bootstrap.bzl before it runs it, so what runs on macOS is the pinned program and not another build of the same source.
  unpack_cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/stages_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Build the macOS unpack
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out unpack-macos-aarch64 //tools/bootstrap:unpack_macos_aarch64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpack-macos-aarch64
          path: unpack-macos-aarch64
          if-no-files-found: error

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The unpack program on macOS. The farm cannot run a macOS binary, so this job is the proof that the pinned macOS build is a working program: on GitHub's macos-15 runner
  # (aarch64) the program of `unpack_cross` is checked against the pin and run on the REAL darwin zig 0.12.0 tarball (the pinned download of rules/pins/hosts.bzl: its sha256 and
  # size are checked by unpack itself) into a tree equal to the one the system's tar makes (contents, modes, symbolic links), whose zig then runs and says its version. The
  # pinned zig 0.15.2 for macOS also builds the source natively and runs the unit tests there. ci/unpack_macos_check.zig holds the urls and digests below to the tables in
  # hosts.bzl and bootstrap.bzl. No rule of buildrules runs on macOS yet.
  unpack_macos:
    runs-on: macos-15
    needs: unpack_cross
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: The machine is aarch64 macOS
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpack-macos-aarch64
          path: cross

      - name: The program is the pinned one
        run: |
          echo "e8be0f022d4e40bc61e0325130d7645b24b96d5b5123c8b601dbea996ef41052  cross/unpack-macos-aarch64" | shasum -a 256 -c -
          test "$(stat -f %z cross/unpack-macos-aarch64)" = 163480
          chmod +x cross/unpack-macos-aarch64

      - name: Fetch the pinned zig 0.15.2 for macOS
        run: |
          curl --fail --silent --show-error --location --retry 3 --output zig-next.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-next.tar.xz" | shasum -a 256 -c -
          mkdir zig-next
          tar -xJf zig-next.tar.xz -C zig-next --strip-components 1
          ./zig-next/zig version

      - name: Build unpack natively
        run: ./zig-next/zig build-exe -OReleaseSafe -fstrip tools/bootstrap/src/unpack.zig -femit-bin=unpack-native

      # The runner is macos-15 but the macOS minimum of buildrules is 13.0: what the pinned zig 0.15.2 makes for `-target aarch64-macos` with no version, and what the
      # pinned cross-built program is. A build made natively takes the runner's own version (15.x), so the build here names the target. ci/macho_minos.zig reads the
      # Mach-O's minos and fails when it is above the limit.
      - name: Build unpack for the pinned macOS target
        run: ./zig-next/zig build-exe -OReleaseSafe -fstrip -target aarch64-macos.13.0 tools/bootstrap/src/unpack.zig -femit-bin=unpack-pinned

      - name: The macOS minimum of the pinned program and of the build for the pinned target is at most 13.0
        run: ./zig-next/zig run ci/macho_minos.zig -- --max 13.0 cross/unpack-macos-aarch64 unpack-pinned

      - name: The unit tests, natively
        run: |
          for name in paths inflate tar extract zip xz main pins oom; do
            ./zig-next/zig test "tools/bootstrap/src/${name}_test.zig"
          done

      - name: Fetch the real darwin zig 0.12.0 tarball
        run: curl --fail --silent --show-error --location --retry 3 --output zig-darwin.tar.xz https://ziglang.org/download/0.12.0/zig-macos-aarch64-0.12.0.tar.xz

      - name: Unpack it with the pinned program, checking its sha256 and size
        run: ./cross/unpack-macos-aarch64 --strip-components 1 --sha256 294e224c14fd0822cfb15a35cf39aa14bd9967867999bf8bdfe3db7ddec2a27f --size 43447724 zig-darwin.tar.xz zig-from-unpack

      - name: The tree equals the system tar's, contents, modes and links
        run: |
          mkdir zig-from-tar
          tar -xJf zig-darwin.tar.xz -C zig-from-tar --strip-components 1
          diff -r zig-from-tar zig-from-unpack
          (cd zig-from-tar && find . -print0 | sort -z | xargs -0 stat -f '%N %Lp %Y') > listing-tar.txt
          (cd zig-from-unpack && find . -print0 | sort -z | xargs -0 stat -f '%N %Lp %Y') > listing-unpack.txt
          diff listing-tar.txt listing-unpack.txt

      - name: The unpacked zig runs and is 0.12.0
        run: test "$(./zig-from-unpack/zig version)" = 0.12.0

      - name: A cut-off tarball is refused
        run: |
          head -c 1000000 zig-darwin.tar.xz > zig-cut.tar.xz
          if ./cross/unpack-macos-aarch64 --check zig-cut.tar.xz; then echo "a cut-off tarball was accepted"; exit 1; fi

  # A Mac that runs Buck2 itself (`mode = local` on macOS arm64, docs/contract.md section 14): the tool tier of the Mojo rules is built for the Mac by its own zig and a Mojo
  # package is compiled and tested natively on it, with a macOS compile naming the one host `local`. The farm cannot run a macOS binary, so this job is the proof that this
  # works. The runner's /bin, /usr/bin, C driver and SDK are what the actions meet; none is in an action key.
  mojo_macos:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: The machine is aarch64 macOS
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64

      # The release pinned in tools/buck2 for macos-aarch64 (the digest is the sha256 of the .zst); ci/stages_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-apple-darwin.zst
          echo "aacdf7cabe34b9b5dc74866b8dcf7410cdbae3ad2dccef45b7ee9851cb781528  buck2.zst" | shasum -a 256 -c -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: The execution platform of this machine is platforms:macos_aarch64
        run: |
          ./buck2 audit execution-platform-resolution -c buildrules_re.mode=local //rules/pins:zig \
            | grep --fixed-strings --quiet "Execution platform: buildrules//platforms:macos_aarch64"

      - name: The zigs, the applets and the Mojo tools build for the Mac
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            //rules/pins:zig //rules/pins:zig_next //rules/pins:macos_applets //rules/pins:macos_applets_unit \
            //rules/mojo:mojo_launch //rules/mojo:mojo_compile_macos //rules/mojo:conda_unpack

      # Every unit test of the tools the Mojo build reaches, run on the Mac, with --keep-going so that one run names every test that assumes Linux.
      - name: The unit tests of the Mojo tools pass on the Mac
        run: |
          ./buck2 build --console simple --keep-going -c buildrules_re.mode=local \
            //rules/check:check_unit //rules/check:cmds_unit //rules/check:files_unit //rules/check:hang_unit //rules/check:install_root_unit \
            //rules/check:isa_unit //rules/check:oom_unit //rules/check:runspec_libdir_unit //rules/check:runspec_unit \
            //rules/mojo:conda_libs_unit //rules/mojo:files_check_unit //rules/mojo:graph_norm_unit //rules/mojo:mojo_compile_macos_unit \
            //rules/mojo:mojo_launch_unit //rules/mojo:table_check_unit //rules/pins:zig_next_version //rules/toolbox:toolbox_unit

      - name: A Mojo package builds and passes its tests on the Mac
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            -c buildrules_re.macos_library_dirs=/opt/homebrew/lib \
            --target-platforms buildrules//platforms:macos_aarch64 \
            //examples/mojo/subdirs:lib

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The same repositories on a farm, when one is configured. The farm-connect action is the one the farm's other repositories use; its repository and the
  # full commit to use are repository variables (no repository is named in this file), and tools/stage refuses a checkout that is not that commit
  # before the action runs. A job from a fork gets neither the variables nor the token, and is skipped like the other jobs.
  beta_farm:
    needs: [tools]
    if: ${{ vars.FARM_ADDRESS != '' && vars.FARM_CONNECT_REF != '' }}
    name: beta ${{ matrix.lang }} (farm)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, cxx, zig, node, mixed]
    env:
      LANG_DIR: ${{ matrix.lang }}
      ORIGIN: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
      CONNECT_REF: ${{ vars.FARM_CONNECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beta-tools
          path: tool
      - run: chmod +x tool/stage tool/buildrules tool/buck2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.FARM_CONNECT_REPO }}
          ref: ${{ vars.FARM_CONNECT_REF }}
          path: farm-action
          persist-credentials: false
      - name: the action that joins the farm is at the commit the variable names
        run: tool/stage action-ref --dir farm-action --ref "$CONNECT_REF"
      - name: connect to the farm
        uses: ./farm-action/.github/actions/farm-connect
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      - name: The repository, as a user starts it, built on the farm
        run: tool/stage beta --root "$GITHUB_WORKSPACE" --lang "$LANG_DIR" --work "$RUNNER_TEMP/beta" --origin "$ORIGIN" --commit "$COMMIT" --buck2 "$GITHUB_WORKSPACE/tool/buck2" --buildrules "$GITHUB_WORKSPACE/tool/buildrules" --exec farm --farm-config "$HOME/.buckconfig.d/farm.buckconfig" --summary "$GITHUB_STEP_SUMMARY"
