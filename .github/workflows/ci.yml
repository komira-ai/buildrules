# Public CI: builds and tests the repository on GitHub's hosted runners, with every action run on the runner itself
# (`-c buildrules_re.mode=local`, docs/contract.md section 14, passed to every buck2 command that loads the graph: the execution
# platforms are analysed by build, bxl, audit, query and test alike, and fail without a mode). The tools of the actions are the pinned toolchains, so
# the runner supplies buck2 and its kernel and nothing else. ci/workflow_check.zig (`//ci:workflow`) checks this file.
#
# A pull request runs on linux x86_64 runners alone (ci/pr_runners_check.zig holds every workflow a pull request starts to it). The other hosts (linux aarch64, macOS arm64)
# are the beta stage of the release (beta.yml, called by release.yml after the merge).
name: ci

on:
  pull_request:
  # A push to main is tested by release.yml, which calls this workflow as its first stage (gate) and releases only when it is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # x86-64-v3 tests of //ci:matrix run on the runner's CPU.
      - name: CPU has x86-64-v3
        run: |
          for f in avx2 bmi1 bmi2 fma movbe abm; do
            grep -qw "$f" /proc/cpuinfo || { echo "this runner's CPU lacks $f (x86-64-v3)"; exit 1; }
          done

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Restore the buck2 output cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('tools/buck2', '**/package-lock.json', '**/Cargo.lock', '**/*.lock.bzl', 'rules/**/pins.bzl', 'toolchains/*.bzl', 'rust-toolchain.toml') }}
          restore-keys: |
            buck-out-${{ runner.os }}-

      # //ci:all builds every target of the tree except the refusal fixtures (ci/all.bzl lists each with its reason). This step fails when a
      # target is in neither //ci:all nor //ci:mojo nor that list, so a new target cannot go unbuilt.
      - name: Every target of the tree is covered
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:completeness.bxl:check

      # A Mojo package built for linux aarch64 or macOS arm64 needs workers of that kind; with no worker property set for them (a runner has none) every target of
      # it is refused naming the key (linux aarch64: skipped, "waiting on linux-arm64 hardware", while the switch is off), and linux x86_64 is as it was (ci/exec_select.bzl). The state with the sets configured needs a farm: `ci/exec_select.bxl`.
      - name: Mojo actions are placed on the host of the target platform
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:exec_select.bxl:check -- --state absent

      # The same with the linux arm64 switch on (it is off by default: linux arm64 farm hardware is not racked yet, rules/platforms.bzl): both Arm platforms are refused naming their key.
      - name: Mojo actions on Arm are refused without workers (linux arm64 switch on)
        run: ./buck2 bxl -c buildrules_re.mode=local -c buildrules_re.linux_arm64_enabled=true //ci:exec_select.bxl:check -- --state absent_enabled

      # The tool tier of the Mojo rules runs on the machine's own execution platform, and a macOS compile names the hosts it may run on (ci/tool_exec.bzl). A Mac that
      # runs Buck2 itself is analysed here on this Linux runner (`[buildrules_re] local_host` names the machine of local mode); nothing runs.
      - name: The tools of the Mojo rules are placed on the machine running Buck2
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:tool_exec.bxl:check -- --state local_linux

      - name: The tools of the Mojo rules on a Mac that runs Buck2
        run: ./buck2 bxl -c buildrules_re.mode=local --config-file ci/tool_exec/local_mac.buckconfig //ci:tool_exec.bxl:check -- --state local_mac

      - name: A Mac that runs Buck2 and names host identities
        run: ./buck2 bxl -c buildrules_re.mode=local --config-file ci/tool_exec/local_mac_named.buckconfig //ci:tool_exec.bxl:check -- --state local_mac_named

      - name: The local host beside an identity is refused
        run: ./buck2 bxl -c buildrules_re.mode=local --config-file ci/tool_exec/local_mac_mixed.buckconfig //ci:tool_exec.bxl:check -- --state local_mac_mixed

      - name: The local host named as an identity is refused
        run: ./buck2 bxl -c buildrules_re.mode=local --config-file ci/tool_exec/local_mac_sentinel.buckconfig //ci:tool_exec.bxl:check -- --state local_mac_sentinel

      # Every [buildrules_re] key is read from the root cell, whichever cell loads the rules: ci/rootcell is a cell with no such section, and the linux arm64 switch
      # is set for the root cell alone (ci/root_keys.bzl). The states with property sets (remote mode) need no farm either, and are in the header of ci/root_keys.bxl.
      - name: The root cell's keys are seen from another cell
        run: ./buck2 bxl -c buildrules_re.mode=local -c buildrules//buildrules_re.linux_arm64_enabled=true //ci:root_keys.bxl:check -- --state local

      # //ci:mojo is not built: its packages need a package channel, which is fetched through
      # buildrules.url_map from a mirror a public runner does not have (docs/contract.md section 14).
      - name: Build and test
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            //ci:all

      # The .deb of the command line (tools/channels, packaging/deb) as the release makes it, from the unstamped linux-x86_64 binary: dpkg reads it. A pull
      # request proves this here; the release builds the same package from the stamped binaries (release.yml, build-cli). Lintian is not run here: it is a Perl
      # program with dozens of distribution packages under it, which this workflow does not fetch by digest, so a gate on it would move with the runner's archive.
      # lintian.yml runs it daily and on demand as an advisory (a red run there is a finding, never a red pull request or release).
      - name: Build the channels program
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-channels //tools/channels:channels

      - name: Build the linux-x86_64 command line
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-buildrules //cli:buildrules_linux_x86_64

      - run: chmod +x ci-channels

      - name: Package it as a .deb
        run: ./ci-channels deb-package --binary ci-buildrules --name buildrules --version 0.0.0 --arch amd64 --packaging packaging/deb --out ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the control file
        run: dpkg-deb --info ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the contents
        run: dpkg-deb --contents ci-debs/buildrules_0.0.0_amd64.deb

      - name: Stop buck2
        if: always()
        run: ./buck2 kill
