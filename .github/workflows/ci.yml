# Public CI: builds and tests the repository on GitHub's hosted runners, with every action run on the runner itself
# (`-c buildrules_re.mode=local`, docs/contract.md section 14, passed to every buck2 command that loads the graph: the execution
# platforms are analysed by build, bxl, audit, query and test alike, and fail without a mode). The tools of the actions are the pinned toolchains, so
# the runner supplies buck2 and its kernel and nothing else. ci/workflow_check.zig (`//ci:workflow`) checks this file.
name: ci

on:
  pull_request:
  # A push to main is tested by release.yml, which calls this workflow as its first stage (gate) and releases only when it is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # x86-64-v3 tests of //ci:matrix run on the runner's CPU.
      - name: CPU has x86-64-v3
        run: |
          for f in avx2 bmi1 bmi2 fma movbe abm; do
            grep -qw "$f" /proc/cpuinfo || { echo "this runner's CPU lacks $f (x86-64-v3)"; exit 1; }
          done

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Restore the buck2 output cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('tools/buck2', '**/package-lock.json', '**/Cargo.lock', '**/*.lock.bzl', 'rules/**/pins.bzl', 'toolchains/*.bzl', 'rust-toolchain.toml') }}
          restore-keys: |
            buck-out-${{ runner.os }}-

      # //ci:all builds every target of the tree except the refusal fixtures (ci/all.bzl lists each with its reason). This step fails when a
      # target is in neither //ci:all nor //ci:mojo nor that list, so a new target cannot go unbuilt.
      - name: Every target of the tree is covered
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:completeness.bxl:check

      # A Mojo package built for linux aarch64 or macOS arm64 needs workers of that kind; with no worker property set for them (a runner has none) every target of
      # it is refused naming the key (linux aarch64: skipped, "waiting on linux-arm64 hardware", while the switch is off), and linux x86_64 is as it was (ci/exec_select.bzl). The state with the sets configured needs a farm: `ci/exec_select.bxl`.
      - name: Mojo actions are placed on the host of the target platform
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:exec_select.bxl:check -- --state absent

      # The same with the linux arm64 switch on (it is off by default: linux arm64 farm hardware is not racked yet, rules/platforms.bzl): both Arm platforms are refused naming their key.
      - name: Mojo actions on Arm are refused without workers (linux arm64 switch on)
        run: ./buck2 bxl -c buildrules_re.mode=local -c buildrules_re.linux_arm64_enabled=true //ci:exec_select.bxl:check -- --state absent_enabled

      # The tool tier of the Mojo rules runs on the machine's own execution platform, and a macOS compile names the hosts it may run on (ci/tool_exec.bzl). A Mac that
      # runs Buck2 itself is analysed here on this Linux runner (`[buildrules_re] local_host` names the machine of local mode); nothing runs.
      - name: The tools of the Mojo rules are placed on the machine running Buck2
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:tool_exec.bxl:check -- --state local_linux

      - name: The tools of the Mojo rules on a farm
        run: ./buck2 bxl --config-file ci/exec_select.buckconfig //ci:tool_exec.bxl:check -- --state farm

      - name: The tools of the Mojo rules on a Mac that runs Buck2
        run: ./buck2 bxl --config-file ci/tool_exec/local_mac.buckconfig //ci:tool_exec.bxl:check -- --state local_mac

      - name: A Mac that runs Buck2 and names host identities
        run: ./buck2 bxl --config-file ci/tool_exec/local_mac_named.buckconfig //ci:tool_exec.bxl:check -- --state local_mac_named

      - name: The local host beside an identity is refused
        run: ./buck2 bxl --config-file ci/tool_exec/local_mac_mixed.buckconfig //ci:tool_exec.bxl:check -- --state local_mac_mixed

      - name: The local host on a farm is refused
        run: ./buck2 bxl --config-file ci/tool_exec/sentinel_on_farm.buckconfig //ci:tool_exec.bxl:check -- --state sentinel_on_farm

      # Every [buildrules_re] key is read from the root cell, whichever cell loads the rules: ci/rootcell is a cell with no such section, and the linux arm64 switch
      # is set for the root cell alone (ci/root_keys.bzl). The states with property sets (remote mode) need no farm either, and are in the header of ci/root_keys.bxl.
      - name: The root cell's keys are seen from another cell
        run: ./buck2 bxl -c buildrules_re.mode=local -c buildrules//buildrules_re.linux_arm64_enabled=true //ci:root_keys.bxl:check -- --state local

      # //ci:mojo is not built: its packages need a package channel, which is fetched through
      # buildrules.url_map from a mirror a public runner does not have (docs/contract.md section 14).
      - name: Build and test
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            //ci:all

      # The .deb of the command line (tools/channels, packaging/deb) as the release makes it, from the unstamped linux-x86_64 binary: dpkg reads it. A pull
      # request proves this here; the release builds the same package from the stamped binaries (release.yml, build-cli). Lintian is not run here: it is a Perl
      # program with dozens of distribution packages under it, which this workflow does not fetch by digest, so a gate on it would move with the runner's archive.
      # lintian.yml runs it daily and on demand as an advisory (a red run there is a finding, never a red pull request or release).
      - name: Build the channels program
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-channels //tools/channels:channels

      - name: Build the linux-x86_64 command line
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-buildrules //cli:buildrules_linux_x86_64

      - run: chmod +x ci-channels

      - name: Package it as a .deb
        run: ./ci-channels deb-package --binary ci-buildrules --name buildrules --version 0.0.0 --arch amd64 --packaging packaging/deb --out ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the control file
        run: dpkg-deb --info ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the contents
        run: dpkg-deb --contents ci-debs/buildrules_0.0.0_amd64.deb

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The linux-aarch64 host (docs/pins.md, "Other hosts"; rules/pins/hosts.bzl). The same buck2 release as above for this machine, the execution
  # platform that local mode registers on it (platforms:linux_aarch64, chosen by host_info()), and every pinned download of the aarch64 hosts, which
  # buck2 checks against the sha256 and the size in the table. Nothing is compiled here yet: no rule runs on this host until a pinned busybox exists
  # for it (hosts.bzl says why), and this job is where that work becomes visible as a red or a green leg.
  host_arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release pinned in tools/buck2 for linux-aarch64 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-unknown-linux-gnu.zst
          echo "e35027a8e3f702fd9f080074ac64ebc80e2a0fe8d669d46d85afc31b0ec4a463  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: The machine is aarch64
        run: test "$(uname -m)" = aarch64

      - name: The execution platform of this machine is platforms:linux_aarch64
        run: |
          ./buck2 audit execution-platform-resolution -c buildrules_re.mode=local //rules/pins:host_downloads \
            | grep --fixed-strings --quiet "Execution platform: buildrules//platforms:linux_aarch64"

      - name: Download and verify the pins of the aarch64 hosts
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            --target-platforms buildrules//platforms:linux_aarch64 \
            //rules/pins:host_downloads

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The macOS program of unpack (tools/bootstrap, docs/pins.md "unpack") exactly as it is pinned: built on this linux runner the way the farm and the release build it
  # (`//tools/bootstrap:unpack_macos_aarch64`, cross-compiled), and handed to the macos-14 job below as an artifact. The macOS job checks its sha256 and size against the
  # pin row of rules/pins/bootstrap.bzl before it runs it, so what runs on macOS is the pinned program and not another build of the same source.
  unpack_cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Build the macOS unpack
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out unpack-macos-aarch64 //tools/bootstrap:unpack_macos_aarch64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpack-macos-aarch64
          path: unpack-macos-aarch64
          if-no-files-found: error

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The unpack program on macOS. The farm cannot run a macOS binary, so this job is the proof that the pinned macOS build is a working program: on GitHub's macos-14 runner
  # (aarch64) the program of `unpack_cross` is checked against the pin and run on the REAL darwin zig 0.12.0 tarball (the pinned download of rules/pins/hosts.bzl: its sha256 and
  # size are checked by unpack itself) into a tree equal to the one the system's tar makes (contents, modes, symbolic links), whose zig then runs and says its version. The
  # pinned zig 0.15.2 for macOS also builds the source natively and runs the unit tests there. ci/unpack_macos_check.zig holds the urls and digests below to the tables in
  # hosts.bzl and bootstrap.bzl. No rule of buildrules runs on macOS yet.
  unpack_macos:
    runs-on: macos-14
    needs: unpack_cross
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The machine is aarch64 macOS
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpack-macos-aarch64
          path: cross

      - name: The program is the pinned one
        run: |
          echo "e8be0f022d4e40bc61e0325130d7645b24b96d5b5123c8b601dbea996ef41052  cross/unpack-macos-aarch64" | shasum -a 256 -c -
          test "$(stat -f %z cross/unpack-macos-aarch64)" = 163480
          chmod +x cross/unpack-macos-aarch64

      - name: Fetch the pinned zig 0.15.2 for macOS
        run: |
          curl --fail --silent --show-error --location --retry 3 --output zig-next.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-next.tar.xz" | shasum -a 256 -c -
          mkdir zig-next
          tar -xJf zig-next.tar.xz -C zig-next --strip-components 1
          ./zig-next/zig version

      - name: Build unpack natively
        run: ./zig-next/zig build-exe -OReleaseSafe -fstrip tools/bootstrap/src/unpack.zig -femit-bin=unpack-native

      - name: The unit tests, natively
        run: |
          for name in paths inflate tar extract zip xz main pins oom; do
            ./zig-next/zig test "tools/bootstrap/src/${name}_test.zig"
          done

      - name: Fetch the real darwin zig 0.12.0 tarball
        run: curl --fail --silent --show-error --location --retry 3 --output zig-darwin.tar.xz https://ziglang.org/download/0.12.0/zig-macos-aarch64-0.12.0.tar.xz

      - name: Unpack it with the pinned program, checking its sha256 and size
        run: ./cross/unpack-macos-aarch64 --strip-components 1 --sha256 294e224c14fd0822cfb15a35cf39aa14bd9967867999bf8bdfe3db7ddec2a27f --size 43447724 zig-darwin.tar.xz zig-from-unpack

      - name: The tree equals the system tar's, contents, modes and links
        run: |
          mkdir zig-from-tar
          tar -xJf zig-darwin.tar.xz -C zig-from-tar --strip-components 1
          diff -r zig-from-tar zig-from-unpack
          (cd zig-from-tar && find . -print0 | sort -z | xargs -0 stat -f '%N %Lp %Y') > listing-tar.txt
          (cd zig-from-unpack && find . -print0 | sort -z | xargs -0 stat -f '%N %Lp %Y') > listing-unpack.txt
          diff listing-tar.txt listing-unpack.txt

      - name: The unpacked zig runs and is 0.12.0
        run: test "$(./zig-from-unpack/zig version)" = 0.12.0

      - name: A cut-off tarball is refused
        run: |
          head -c 1000000 zig-darwin.tar.xz > zig-cut.tar.xz
          if ./cross/unpack-macos-aarch64 --check zig-cut.tar.xz; then echo "a cut-off tarball was accepted"; exit 1; fi
