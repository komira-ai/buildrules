# Public CI: builds and tests the repository on GitHub's hosted runners, with every action run on the runner itself
# (`-c buildrules_re.mode=local`, docs/contract.md section 14, passed to every buck2 command that loads the graph: the execution
# platforms are analysed by build, bxl, audit, query and test alike, and fail without a mode). The tools of the actions are the pinned toolchains, so
# the runner supplies buck2 and its kernel and nothing else. ci/workflow_check.zig (`//ci:workflow`) checks this file.
name: ci

on:
  pull_request:
  # A push to main is tested by release.yml, which calls this workflow as its first stage (gate) and releases only when it is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # x86-64-v3 tests of //ci:matrix run on the runner's CPU.
      - name: CPU has x86-64-v3
        run: |
          for f in avx2 bmi1 bmi2 fma movbe abm; do
            grep -qw "$f" /proc/cpuinfo || { echo "this runner's CPU lacks $f (x86-64-v3)"; exit 1; }
          done

      # The release pinned in tools/buck2 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: Restore the buck2 output cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buck-out
          key: buck-out-${{ runner.os }}-${{ hashFiles('tools/buck2', '**/package-lock.json', '**/Cargo.lock', '**/*.lock.bzl', 'rules/**/pins.bzl', 'toolchains/*.bzl', 'rust-toolchain.toml') }}
          restore-keys: |
            buck-out-${{ runner.os }}-

      # //ci:all builds every target of the tree except the refusal fixtures (ci/all.bzl lists each with its reason). This step fails when a
      # target is in neither //ci:all nor //ci:mojo nor that list, so a new target cannot go unbuilt.
      - name: Every target of the tree is covered
        run: ./buck2 bxl -c buildrules_re.mode=local //ci:completeness.bxl:check

      # //ci:mojo is not built: its packages need a package channel, which is fetched through
      # buildrules.url_map from a mirror a public runner does not have (docs/contract.md section 14).
      - name: Build and test
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            //ci:all

      # The .deb of the command line (tools/channels, packaging/deb) as the release makes it, from the unstamped linux-x86_64 binary: dpkg reads it and lintian
      # finds no error. A pull request proves this here; the release builds the same package from the stamped binaries (release.yml, build-cli). Lintian is the
      # runner's own, installed from its distribution (the one tool of the build that is not pinned).
      - name: Build the channels program
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-channels //tools/channels:channels

      - name: Build the linux-x86_64 command line
        run: ./buck2 build --console simple -c buildrules_re.mode=local --out ci-buildrules //cli:buildrules_linux_x86_64

      - run: chmod +x ci-channels

      - name: Package it as a .deb
        run: ./ci-channels deb-package --binary ci-buildrules --name buildrules --version 0.0.0 --arch amd64 --packaging packaging/deb --out ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the control file
        run: dpkg-deb --info ci-debs/buildrules_0.0.0_amd64.deb

      - name: dpkg-deb reads the contents
        run: dpkg-deb --contents ci-debs/buildrules_0.0.0_amd64.deb

      - name: Refresh the package lists
        run: sudo apt-get update -qq

      - name: Install lintian
        run: sudo apt-get install -y -qq lintian

      - name: lintian finds no error, every tag printed
        run: lintian --fail-on error --tag-display-limit 0 ci-debs/buildrules_0.0.0_amd64.deb

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The linux-aarch64 host (docs/pins.md, "Other hosts"; rules/pins/hosts.bzl). The same buck2 release as above for this machine, the execution
  # platform that local mode registers on it (platforms:linux_aarch64, chosen by host_info()), and every pinned download of the aarch64 hosts, which
  # buck2 checks against the sha256 and the size in the table. Nothing is compiled here yet: no rule runs on this host until a pinned busybox exists
  # for it (hosts.bzl says why), and this job is where that work becomes visible as a red or a green leg.
  host_arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release pinned in tools/buck2 for linux-aarch64 (the digest is the sha256 of the .zst); ci/workflow_check.zig compares both.
      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-aarch64-unknown-linux-gnu.zst
          echo "e35027a8e3f702fd9f080074ac64ebc80e2a0fe8d669d46d85afc31b0ec4a463  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2
          ./buck2 --version

      - name: The machine is aarch64
        run: test "$(uname -m)" = aarch64

      - name: The execution platform of this machine is platforms:linux_aarch64
        run: |
          ./buck2 audit execution-platform-resolution -c buildrules_re.mode=local //rules/pins:host_downloads \
            | grep --fixed-strings --quiet "Execution platform: buildrules//platforms:linux_aarch64"

      - name: Download and verify the pins of the aarch64 hosts
        run: |
          ./buck2 build --console simple -c buildrules_re.mode=local \
            --target-platforms buildrules//platforms:linux_aarch64 \
            //rules/pins:host_downloads

      - name: Stop buck2
        if: always()
        run: ./buck2 kill

  # The unpack program on macOS (tools/bootstrap, docs/pins.md "unpack"). The farm cannot run a macOS binary, so this job is the proof that the macOS build is a working program:
  # on GitHub's macos-14 runner (aarch64) the pinned zig 0.15.2 for macOS builds it from the tree, the unit tests run natively, and it unpacks the REAL darwin zig 0.12.0
  # tarball (the pinned download of rules/pins/hosts.bzl: its sha256 and size are checked by unpack itself) into a tree equal to the one the system's tar makes, whose
  # zig then runs and says its version. ci/unpack_macos_check.zig holds the urls and digests below to the table in hosts.bzl. No rule of buildrules runs on macOS yet.
  unpack_macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The machine is aarch64 macOS
        run: test "$(uname -s)-$(uname -m)" = Darwin-arm64

      - name: Fetch the pinned zig 0.15.2 for macOS
        run: |
          curl --fail --silent --show-error --location --retry 3 --output zig-next.tar.xz https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          echo "3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b  zig-next.tar.xz" | shasum -a 256 -c -
          mkdir zig-next
          tar -xJf zig-next.tar.xz -C zig-next --strip-components 1
          ./zig-next/zig version

      - name: Build unpack for macOS
        run: ./zig-next/zig build-exe -OReleaseSafe -fstrip tools/bootstrap/src/unpack.zig -femit-bin=unpack

      - name: The unit tests, natively
        run: |
          for name in paths inflate tar extract zip xz main pins oom; do
            ./zig-next/zig test "tools/bootstrap/src/${name}_test.zig"
          done

      - name: Fetch the real darwin zig 0.12.0 tarball
        run: curl --fail --silent --show-error --location --retry 3 --output zig-darwin.tar.xz https://ziglang.org/download/0.12.0/zig-macos-aarch64-0.12.0.tar.xz

      - name: Unpack it, checking its sha256 and size
        run: ./unpack --strip-components 1 --sha256 294e224c14fd0822cfb15a35cf39aa14bd9967867999bf8bdfe3db7ddec2a27f --size 43447724 zig-darwin.tar.xz zig-from-unpack

      - name: The tree equals the system tar's
        run: |
          mkdir zig-from-tar
          tar -xJf zig-darwin.tar.xz -C zig-from-tar --strip-components 1
          diff -r zig-from-tar zig-from-unpack

      - name: The unpacked zig runs and is 0.12.0
        run: test "$(./zig-from-unpack/zig version)" = 0.12.0

      - name: A cut-off tarball is refused
        run: |
          head -c 1000000 zig-darwin.tar.xz > zig-cut.tar.xz
          if ./unpack --check zig-cut.tar.xz; then echo "a cut-off tarball was accepted"; exit 1; fi
