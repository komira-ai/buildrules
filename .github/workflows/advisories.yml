# A daily scan of the repository's lockfiles for known vulnerabilities (OSV database). It reports and never gates: it runs on a schedule and by hand only (never on a
# pull request or a push, so it cannot block a change or turn main or a release red), writes what it finds to the job summary, and keeps ONE issue titled
# `Advisories` up to date (opened or updated when there are findings, closed when there are none). The job fails only when the scan cannot run: the tool does not
# download to its pinned sha256, the scanner itself errors, or a `gh` call of the Report step fails (an API hiccup): the Report step stops at the first failed call, so it can never
# create a second issue, and the next day's run reports again. That red is on the scheduled run alone. ci/advisories_check.zig (`//ci:workflow`) holds this file to all
# of it. Licence and ban checks are not this: they may gate, and this does not.
#
# The tool is the OSV-Scanner release pinned in rules/pins/pins.bzl (`osv_scanner`): one static binary that reads npm (package-lock.json) and crates (Cargo.lock)
# lockfiles, with the url and the sha256 checked here against that table and the downloaded file hashed by the farm. The generated *.lock.bzl files of this tree are
# derived from those two lockfile kinds, so they are covered by them.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release pinned in rules/pins/pins.bzl; ci/advisories_check.zig compares the url and the sha256 with the table.
      - name: Install OSV-Scanner
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner

      # Lockfiles under a fixture directory are test inputs, not dependencies of ours: they are not scanned, so the issue can be fixed and closed. The beta templates are scanned (users copy them; their lockfiles are ours to bump).
      # Exit 0 is no finding and 1 is a finding (both are a scan that ran); anything else is a scan that could not run.
      - name: Scan the lockfiles
        run: |
          set -euo pipefail
          set --
          while IFS= read -r -d '' lock; do set -- "$@" -L "$lock"; done < <(git ls-files -z -- ':(glob)**/package-lock.json' ':(glob)**/Cargo.lock' ':(exclude,glob)**/fixture/**')
          test "$#" -gt 0
          rc=0
          ./osv-scanner scan --format markdown --output-file advisories.md "$@" || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          echo "FOUND=$rc" >> "$GITHUB_ENV"

      # The token is on this step alone: the downloaded scanner never runs with it in its environment.
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=Advisories
          number="$(gh issue list --state all --limit 100 --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          state=""
          if [ -n "$number" ]; then state="$(gh issue view "$number" --json state --jq .state)"; fi
          if [ "$FOUND" = 1 ]; then
            { echo "## Advisories"; echo; head -c 60000 advisories.md; } > body.md
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file body.md
            else
              gh issue edit "$number" --body-file body.md
              if [ "$state" = CLOSED ]; then gh issue reopen "$number"; fi
            fi
          else
            echo "No known vulnerabilities in the scanned lockfiles." >> "$GITHUB_STEP_SUMMARY"
            if [ "$state" = OPEN ]; then gh issue close "$number" --comment "The last scan found no known vulnerabilities."; fi
          fi
