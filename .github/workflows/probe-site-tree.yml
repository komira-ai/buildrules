# Temporary probe: what the site build's dist output is on a runner, and what upload-artifact finds of a copy of it. Removed before merge.
name: probe-site-tree

on:
  pull_request:
    paths: [.github/workflows/probe-site-tree.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install buck2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output buck2.zst \
            https://github.com/facebook/buck2/releases/download/2026-09-15/buck2-x86_64-unknown-linux-gnu.zst
          echo "1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89  buck2.zst" | sha256sum --check --strict -
          zstd --decompress --quiet buck2.zst -o buck2
          chmod +x buck2

      - name: Build the dist
        run: ./buck2 build --console simple -c buildrules_re.mode=local --show-full-output //site:dist > "$RUNNER_TEMP/site-outputs.txt"

      - name: What the dist is
        run: |
          cat "$RUNNER_TEMP/site-outputs.txt"
          dist=$(awk '$1 ~ /\/\/site:dist$/ { print $2 }' "$RUNNER_TEMP/site-outputs.txt")
          echo "dist=$dist"
          stat "$dist"
          echo "--- symlinks in or at dist"
          find "$dist" -type l | head -20
          echo "--- top of dist"
          ls -la "$dist" | head -30
          mkdir -p probe-a probe-b
          cp -r --no-preserve=mode "$dist" probe-a/tree
          cp -rL --no-preserve=mode "$dist" probe-b/tree
          echo "--- probe-a (as site.yml copies)"
          ls -la probe-a probe-a/tree | head -30
          echo "--- probe-b (cp -rL)"
          ls -la probe-b probe-b/tree | head -30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-a
          path: probe-a
          retention-days: 1
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-b
          path: probe-b
          retention-days: 1
          if-no-files-found: warn
